name: Update M3U

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate M3U from upstream channel list
        run: python generate_m3u.py --config config.json

      - name: Commit changed playlist
        run: |
          if git diff --quiet -- Zhejiang_Telecom_IPTV.m3u; then
            echo "No playlist changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Zhejiang_Telecom_IPTV.m3u
          git commit -m "chore: update M3U playlist"
          git push
